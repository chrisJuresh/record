<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>record fixture site — light</title>
    <style>
      /*
       * The same site painted light, so that a test can record a page a Mockup
       * left to choose itself would put in a light window rather than a dark
       * one. Deliberately plain for the same reason the dark one is: everything
       * here has to look the same way twice.
       */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0 48px 96px;
        background: #f7f7f9;
        color: #18181b;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        margin: 16px 0;
        padding: 24px;
        border: 1px solid #dcdce0;
        border-radius: 6px;
        background: #ffffff;
      }

      h2 {
        margin: 0;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="heading">Fixture site, in light</h1>
      <p id="tagline">Committed here so no test needs a real Project.</p>
    </header>
    <main>
      <section class="card"><h2>One</h2></section>
      <section class="card"><h2>Two</h2></section>
      <section class="card"><h2>Three</h2></section>
      <section class="card"><h2>Four</h2></section>
      <section class="card"><h2>Five</h2></section>
      <section class="card"><h2>Six</h2></section>
      <section class="card"><h2>Seven</h2></section>
      <section class="card"><h2>Eight</h2></section>
    </main>
  </body>
</html>
